name: SPECTRA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          failed=0
          for script in bin/*.sh lib/*.sh; do
            if bash -n "$script" 2>/dev/null; then
              echo "PASS  $(basename "$script")"
            else
              echo "FAIL  $(basename "$script")"
              failed=1
            fi
          done
          exit $failed

      - name: Module anti-drift
        run: |
          failed=0
          # Explicit expected module list (update when adding/removing modules)
          EXPECTED_MODULES="loop-signals loop-retry loop-wiring loop-git loop-checkpoint"
          # 1. Every expected module must exist AND be sourced
          for mod in $EXPECTED_MODULES; do
            if [[ ! -f "lib/${mod}.sh" ]]; then
              echo "FAIL: expected module lib/${mod}.sh is missing"
              failed=1
            elif ! grep -q "source.*lib/${mod}.sh" bin/spectra-loop.sh; then
              echo "FAIL: lib/${mod}.sh exists but is not sourced in spectra-loop.sh"
              failed=1
            fi
          done
          # 2. Every lib/loop-*.sh on disk must be in expected list (no rogue modules)
          for mod_file in lib/loop-*.sh; do
            [[ -f "$mod_file" ]] || continue
            mod_name=$(basename "$mod_file" .sh)
            if ! echo "$EXPECTED_MODULES" | grep -qw "$mod_name"; then
              echo "FAIL: unexpected module ${mod_file} not in expected list"
              failed=1
            fi
          done
          # 3. No duplicate source lines
          dups=$(grep -E '^source.*lib/loop-' bin/spectra-loop.sh | sort | uniq -d)
          if [[ -n "$dups" ]]; then
            echo "FAIL: duplicate source lines: $dups"
            failed=1
          fi
          # 4. No wildcard sourcing
          if grep -qE 'source.*lib/loop-\*' bin/spectra-loop.sh; then
            echo "FAIL: wildcard sourcing detected (must use explicit list)"
            failed=1
          fi
          if [[ $failed -eq 0 ]]; then
            echo "PASS: all expected modules present, sourced, no duplicates, no wildcards"
          fi
          exit $failed

      - name: Install ShellCheck (pinned)
        run: |
          curl -sL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz | tar -xJ
          sudo mv shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
          rm -rf shellcheck-v0.10.0
          shellcheck --version | head -2

      - name: ShellCheck (errors only — fast fail)
        run: shellcheck --severity=error bin/*.sh lib/*.sh hooks/pre-commit

      - name: ShellCheck ratchet (warnings)
        run: bin/spectra-shellcheck-ratchet.sh --check

      - name: Suppress rationale guard
        run: |
          failed=0
          for f in bin/*.sh lib/*.sh hooks/pre-commit; do
            [[ -f "$f" ]] || continue
            [[ -L "$f" ]] && continue
            prev_line=""
            while IFS= read -r line; do
              if echo "$line" | grep -q '# shellcheck disable='; then
                if ! echo "$prev_line" | grep -q '# RATIONALE:'; then
                  echo "FAIL: $(basename "$f"): disable without RATIONALE: $line"
                  failed=1
                fi
              fi
              prev_line="$line"
            done < "$f"
          done
          if [[ $failed -eq 0 ]]; then
            echo "PASS: all shellcheck disables have preceding RATIONALE comment"
          fi
          exit $failed

      - name: actionlint
        run: |
          bash <(curl -sS https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite
        run: bash tests/run-tests.sh 2>&1 | tee test-output.log

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test-output.log

  wiring:
    name: Wiring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Anti-bypass guard
        run: |
          if [[ "${SPECTRA_SKIP_WIRING:-0}" == "1" ]]; then
            echo "ERROR: SPECTRA_SKIP_WIRING is not allowed in CI"
            exit 1
          fi

      - name: Initialize fixture git repos
        run: |
          for fixture in fixtures/ci-wiring-pass fixtures/ci-wiring-fail; do
            (cd "$fixture" && git init && git config user.name "CI" && git config user.email "ci@spectra" && git add -A && git commit -m "fixture" --quiet)
          done

      - name: Wiring check — pass fixture (expect exit 0)
        run: bin/spectra-verify-wiring.sh fixtures/ci-wiring-pass

      - name: Wiring check — fail fixture (expect exit 1)
        run: |
          set +e
          bin/spectra-verify-wiring.sh fixtures/ci-wiring-fail
          exit_code=$?
          set -e
          if [[ $exit_code -eq 1 ]]; then
            echo "PASS: fail fixture correctly detected wiring violations (exit 1)"
          else
            echo "FAIL: fail fixture should have exited 1, got $exit_code"
            exit 1
          fi
