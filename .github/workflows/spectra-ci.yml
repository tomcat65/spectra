name: SPECTRA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: scripts/spectra-ci-lint.sh --syntax

      - name: Module anti-drift
        run: scripts/spectra-ci-lint.sh --modules

      - name: Install ShellCheck (pinned)
        run: |
          curl -sL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz | tar -xJ
          sudo mv shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
          rm -rf shellcheck-v0.10.0
          shellcheck --version | head -2

      - name: ShellCheck (errors only — fast fail)
        run: scripts/spectra-ci-lint.sh --shellcheck

      - name: ShellCheck ratchet (warnings)
        run: scripts/spectra-ci-lint.sh --ratchet

      - name: Suppress rationale guard
        run: scripts/spectra-ci-lint.sh --rationale

      - name: Install actionlint (pinned)
        run: |
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_checksums.txt
          grep ' actionlint_1.7.7_linux_amd64.tar.gz$' actionlint_1.7.7_checksums.txt | sha256sum -c -
          tar -xzf actionlint_1.7.7_linux_amd64.tar.gz actionlint

      - name: actionlint
        run: ACTIONLINT_BIN=./actionlint scripts/spectra-ci-lint.sh --actionlint

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite
        run: bash tests/run-tests.sh 2>&1 | tee test-output.log

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test-output.log

  wiring:
    name: Wiring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Anti-bypass guard
        run: |
          if [[ "${SPECTRA_SKIP_WIRING:-0}" == "1" ]]; then
            echo "ERROR: SPECTRA_SKIP_WIRING is not allowed in CI"
            exit 1
          fi

      - name: Initialize fixture git repos
        run: |
          for fixture in fixtures/ci-wiring-pass fixtures/ci-wiring-fail; do
            (cd "$fixture" && git init && git config user.name "CI" && git config user.email "ci@spectra" && git add -A && git commit -m "fixture" --quiet)
          done

      - name: Wiring check — pass fixture (expect exit 0)
        run: bin/spectra-verify-wiring.sh fixtures/ci-wiring-pass

      - name: Wiring check — fail fixture (expect exit 1)
        run: |
          set +e
          bin/spectra-verify-wiring.sh fixtures/ci-wiring-fail
          exit_code=$?
          set -e
          if [[ $exit_code -eq 1 ]]; then
            echo "PASS: fail fixture correctly detected wiring violations (exit 1)"
          else
            echo "FAIL: fail fixture should have exited 1, got $exit_code"
            exit 1
          fi
